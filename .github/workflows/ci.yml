name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Full history: tests/test_app.py resolves the commit app/Dockerfile pins
      # to check the image installs the version the app advertises, and a
      # shallow clone does not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No `playwright install`. Chromium is needed to render a dashboard, not
      # to run this suite: tests/conftest.py stubs the renderer and the
      # transports, so nothing here opens a browser, a broker or a socket.
      # `pytest -q` also excludes the `browser` marker by default
      # (`pyproject.toml`); the `browser` job below covers what these stubs
      # deliberately do not.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The whole tree, not just src and tests: scripts/ is code CI runs.
      - name: Lint
        run: ruff check

      - name: Test
        run: pytest -q

      - name: Generated reference is up to date
        run: python scripts/gen_docs.py --check

  browser:
    name: Browser suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The only job that opens a real browser: tests/browser/ (excluded from
      # the `test` job's `pytest -q` by the `browser` marker,
      # `pyproject.toml`) drives DashboardRenderer and the setup UI against a
      # real Chromium, one prototype found only by rendering into it.
      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Test
        run: pytest -m browser

  esphome:
    name: ESPHome accepts the generated configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ESPHome itself, so the check is against the real schema rather than
      # this project's idea of it. `esphome config` validates every component
      # in the document without a toolchain and without a device; it is not a
      # compile and not a flash, and the recipe's untested banner stays.
      #
      # In a venv of its own: ESPHome pins its dependencies exactly, and asking
      # pip to satisfy those and this package's in one environment sent it
      # backtracking to a 2023 ESPHome and a PyYAML that no longer builds. The
      # script only needs the CLI's path (`--esphome`); nothing is shared.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m venv "$RUNNER_TEMP/esphome"
          "$RUNNER_TEMP/esphome/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/esphome/bin/pip" install esphome
          "$RUNNER_TEMP/esphome/bin/esphome" version

      # One generated configuration per catalogued panel that names an
      # `esphome_model` (src/maverick/devices/panels.yaml), in both shapes the
      # generator produces (scripts/check_esphome.py). A model ESPHome does not
      # know, or a key it renamed, fails here instead of at a user's desk.
      - name: Validate
        run: python scripts/check_esphome.py --esphome "$RUNNER_TEMP/esphome/bin/esphome"

  links:
    name: Markdown links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Relative links only, standard library only: no install, no network, no
      # token. An external URL that rots is not this repository's build failing.
      - name: Check relative links
        run: python scripts/check_links.py

  image:
    name: Standalone image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # amd64 only, and never pushed: there is no registry for it yet. This is
      # the one place the root image is built — nothing else in the suite
      # touches Docker.
      - name: Build image
        run: docker build --tag maverick:ci .

      # The same three smoke commands .github/workflows/app.yml runs against
      # the Home Assistant app image, against this one instead: the CLI starts,
      # the panel catalogue loads, and Chromium launches through this
      # project's own launcher (src/maverick/render/browser.py), flags
      # included.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint maverick maverick:ci --version
          docker run --rm --entrypoint maverick maverick:ci panels --json > /dev/null
          docker run --rm -i --entrypoint python3 maverick:ci - <<'EOF'
          import asyncio

          from maverick.render.browser import BrowserPool


          async def main() -> None:
              pool = BrowserPool(max_concurrent=1)
              await pool.start()
              async with pool.page("ci", (320, 240)) as page:
                  await page.goto("about:blank")
                  print("chromium ok:", await page.evaluate("navigator.userAgent"))
              await pool.stop()


          asyncio.run(main())
          EOF
