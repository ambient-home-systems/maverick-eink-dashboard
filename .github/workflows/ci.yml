name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Full history: tests/test_app.py resolves the commit app/Dockerfile pins
      # to check the image installs the version the app advertises, and a
      # shallow clone does not contain it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No `playwright install`. Chromium is needed to render a dashboard, not
      # to run this suite: tests/conftest.py stubs the renderer and the
      # transports, so nothing here opens a browser, a broker or a socket.
      # `pytest -q` also excludes the `browser` marker by default
      # (`pyproject.toml`); the `browser` job below covers what these stubs
      # deliberately do not.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The whole tree, not just src and tests: scripts/ is code CI runs.
      - name: Lint
        run: ruff check

      - name: Test
        run: pytest -q

      - name: Generated reference is up to date
        run: python scripts/gen_docs.py --check

  browser:
    name: Browser suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The only job that opens a real browser: tests/browser/ (excluded from
      # the `test` job's `pytest -q` by the `browser` marker,
      # `pyproject.toml`) drives DashboardRenderer and the setup UI against a
      # real Chromium, one prototype found only by rendering into it.
      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Test
        run: pytest -m browser

  esphome:
    name: ESPHome accepts the generated configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ESPHome itself, so the check is against the real schema rather than
      # this project's idea of it. `esphome config` validates every component
      # in the document without a toolchain and without a device; it is not a
      # compile and not a flash, and the recipe's untested banner stays.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . esphome

      # One generated configuration per catalogued panel that names an
      # `esphome_model` (src/maverick/devices/panels.yaml), in both shapes the
      # generator produces (scripts/check_esphome.py). A model ESPHome does not
      # know, or a key it renamed, fails here instead of at a user's desk.
      - name: Validate
        run: python scripts/check_esphome.py

  links:
    name: Markdown links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Relative links only, standard library only: no install, no network, no
      # token. An external URL that rots is not this repository's build failing.
      - name: Check relative links
        run: python scripts/check_links.py

  image:
    name: Standalone image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # amd64 only, and never pushed: there is no registry for it yet. This is
      # the one place the root image is built — nothing else in the suite
      # touches Docker.
      - name: Build image
        run: docker build --tag maverick:ci .

      # The same three smoke commands the `app` job below runs against the
      # Home Assistant app image, against this one instead: the CLI starts,
      # the panel catalogue loads, and Chromium launches through this
      # project's own launcher (src/maverick/render/browser.py), flags
      # included.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint maverick maverick:ci --version
          docker run --rm --entrypoint maverick maverick:ci panels --json > /dev/null
          docker run --rm -i --entrypoint python3 maverick:ci - <<'EOF'
          import asyncio

          from maverick.render.browser import BrowserPool


          async def main() -> None:
              pool = BrowserPool(max_concurrent=1)
              await pool.start()
              async with pool.page("ci", (320, 240)) as page:
                  await page.goto("about:blank")
                  print("chromium ok:", await page.evaluate("navigator.userAgent"))
              await pool.stop()


          asyncio.run(main())
          EOF

  app:
    name: Home Assistant app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The manifest, against the Supervisor's own schema.
      - name: Lint app manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./app

      - name: Shell syntax
        run: |
          bash -n app/run.sh
          shellcheck --shell=bash --exclude=SC1091 app/run.sh

      # The one place the image is built: nothing in the suite touches Docker.
      # amd64 only; the same Dockerfile is what the Supervisor builds on aarch64.
      - name: Build image
        run: docker build --tag maverick-app:ci app

      # Chromium and Playwright's driver have to agree inside the image, which a
      # smoke test of the CLI alone would not show. BrowserPool is the project's
      # own launcher, flags included.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint maverick maverick-app:ci --version
          docker run --rm --entrypoint maverick maverick-app:ci panels --json > /dev/null
          docker run --rm -i --entrypoint python maverick-app:ci - <<'EOF'
          import asyncio

          from maverick.render.browser import BrowserPool


          async def main() -> None:
              pool = BrowserPool(max_concurrent=1)
              await pool.start()
              async with pool.page("ci", (320, 240)) as page:
                  await page.goto("about:blank")
                  print("chromium ok:", await page.evaluate("navigator.userAgent"))
              await pool.stop()


          asyncio.run(main())
          EOF

      # The other half of the pinned-ref check in tests/test_app.py, from inside
      # the image: the starter config ships from app/rootfs/ at this commit, the
      # package comes from MAVERICK_REF, and every model bar TransportConfig
      # forbids unknown keys. A ref left behind at an older release therefore
      # writes keys that release rejects, and the app dies on its first start
      # with nothing installed and nothing configured — exactly this run.
      - name: Starter configuration loads in the image
        run: |
          docker run --rm -i \
            --env HA_URL=http://homeassistant:8123 \
            --env HA_TOKEN= \
            --env HA_REFRESH_TOKEN= \
            --env HA_CLIENT_ID= \
            --env MAVERICK_LOG_LEVEL=info \
            --env MAVERICK_API_TOKEN= \
            --env MAVERICK_BASE_URL= \
            --env MQTT_ENABLED=false \
            --env MQTT_HOST=core-mosquitto \
            --env MQTT_PORT=1883 \
            --env MQTT_USERNAME= \
            --env MQTT_PASSWORD= \
            --entrypoint python maverick-app:ci - <<'EOF'
          from maverick.app import VERSION
          from maverick.config import load_config

          config = load_config("/usr/share/maverick/maverick.yaml")
          print("maverick", VERSION, "loads the starter config:",
                [display.id for display in config.displays])
          EOF

      # The reproduction the 0.2.x cycle did not have. Until now the options only
      # became configuration inside a Supervisor, through bashio, so every fix to
      # that translation was tested by releasing it. The service reads
      # /data/options.json itself (src/maverick/ha/options.py), which a container
      # can do: an options file, a SUPERVISOR_TOKEN so the app path is taken at
      # all, and nothing whatsoever in the environment.
      #
      # This one runs *this commit's* package, mounted over the one the image
      # installed — the mirror of the step above, which deliberately uses the
      # package from MAVERICK_REF. The ref only moves at a release
      # (CONTRIBUTING.md), so between the change and the release it names a
      # commit that knows nothing of these options; the assertion on
      # maverick.__file__ is what stops this silently testing that one instead.
      # The image still supplies the interpreter and every dependency.
      #
      # No Supervisor answers here, which is the point of the last two
      # assertions: an unreachable one has to leave base_url on the option and
      # MQTT off rather than fail the start.
      - name: The app's options become the configuration in the image
        run: |
          mkdir -p "${RUNNER_TEMP}/options"
          cat > "${RUNNER_TEMP}/options/options.json" <<'EOF'
          {
            "home_assistant_url": "http://homeassistant:8123",
            "home_assistant_token": "a-long-lived-token",
            "home_assistant_refresh_token": null,
            "home_assistant_client_id": null,
            "log_level": "debug",
            "base_url": "http://192.168.1.10:5000",
            "api_token": "an-api-token"
          }
          EOF
          docker run --rm -i \
            --volume "${RUNNER_TEMP}/options:/data:ro" \
            --volume "${GITHUB_WORKSPACE}/src:/src:ro" \
            --env PYTHONPATH=/src \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env SUPERVISOR_TOKEN=not-a-real-token \
            --entrypoint python maverick-app:ci - <<'EOF'
          import maverick

          assert maverick.__file__.startswith("/src/"), maverick.__file__

          # _load is the function run.sh reaches through `maverick ... serve`,
          # and the only step between the Configuration tab and a loaded config.
          from maverick.cli import _load, build_parser

          args = build_parser().parse_args(
              ["-c", "/usr/share/maverick/maverick.yaml", "serve"]
          )
          config = _load(args)

          assert config.home_assistant.token == "a-long-lived-token", config.home_assistant
          assert config.home_assistant.url == "http://homeassistant:8123", config.home_assistant
          # null in options.json is unset, not the string "null" (0.2.4).
          assert config.home_assistant.refresh_token == "", config.home_assistant
          assert config.home_assistant.client_id == "", config.home_assistant
          assert config.log_level == "debug", config.log_level
          assert config.server.api_token == "an-api-token", config.server
          assert config.server.base_url == "http://192.168.1.10:5000", config.server
          assert config.mqtt.enabled is False, config.mqtt
          print("the app's options reached the configuration")
          EOF
