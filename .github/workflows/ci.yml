name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No `playwright install`. Chromium is needed to render a dashboard, not
      # to run the suite: tests/conftest.py stubs the renderer and the
      # transports, so nothing here opens a browser, a broker or a socket.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The whole tree, not just src and tests: scripts/ is code CI runs.
      - name: Lint
        run: ruff check

      - name: Test
        run: pytest -q

      - name: Generated reference is up to date
        run: python scripts/gen_docs.py --check

  links:
    name: Markdown links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Relative links only, standard library only: no install, no network, no
      # token. An external URL that rots is not this repository's build failing.
      - name: Check relative links
        run: python scripts/check_links.py

  app:
    name: Home Assistant app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The manifest, against the Supervisor's own schema.
      - name: Lint app manifest
        uses: frenck/action-addon-linter@v2
        with:
          path: ./app

      - name: Shell syntax
        run: |
          bash -n app/run.sh
          shellcheck --shell=bash --exclude=SC1091 app/run.sh

      # The one place the image is built: nothing in the suite touches Docker.
      # amd64 only; the same Dockerfile is what the Supervisor builds on aarch64.
      - name: Build image
        run: docker build --tag maverick-app:ci app

      # Chromium and Playwright's driver have to agree inside the image, which a
      # smoke test of the CLI alone would not show. BrowserPool is the project's
      # own launcher, flags included.
      - name: Smoke test
        run: |
          docker run --rm --entrypoint maverick maverick-app:ci --version
          docker run --rm --entrypoint maverick maverick-app:ci panels --json > /dev/null
          docker run --rm -i --entrypoint python maverick-app:ci - <<'EOF'
          import asyncio

          from maverick.render.browser import BrowserPool


          async def main() -> None:
              pool = BrowserPool(max_concurrent=1)
              await pool.start()
              async with pool.page("ci", (320, 240)) as page:
                  await page.goto("about:blank")
                  print("chromium ok:", await page.evaluate("navigator.userAgent"))
              await pool.stop()


          asyncio.run(main())
          EOF
