# Home Assistant app manifest.
# https://developers.home-assistant.io/docs/apps/configuration
name: Maverick
version: "0.6.0"
slug: maverick
description: Render Home Assistant dashboards to e-ink panels, monochrome and colour, scheduled or automation-driven
url: https://github.com/ambient-home-systems/maverick-eink-dashboard/blob/main/app/DOCS.md
arch:
  - aarch64
  - amd64
# Pre-built, so installing is a pull and not a build. Without this key the
# Supervisor builds the Dockerfile on the machine installing the app — an
# apt-get of Chromium and a pip install on a Pi, on every install and every
# update — which is what made installing take so long up to 0.6.0. The
# images come from `.github/workflows/app.yml`, tagged with the `version`
# above, one per architecture and a multi-arch manifest under this name.
image: ghcr.io/ambient-home-systems/maverick-app
# The base image runs s6-overlay v3, which is its own init.
init: false
# The Mosquitto broker app is picked up automatically when it is installed;
# nothing breaks when it is not. This line is also the permission: `_mqtt` in
# `src/maverick/ha/options.py` reads the broker's host and credentials from
# `GET /services/mqtt`, which no role reaches — `/services.*` is on the
# api_bypass list in `supervisor/api/middleware/security.py`, tested before the
# role — and `_check_access` in `supervisor/api/services.py` answers
# `403 No access to mqtt service!` unless the app asking declared the service.
services:
  - mqtt:want
# Read-only Supervisor API access, at the default role, which reaches the
# `/.+/info` endpoints and nothing else
# (`supervisor/api/middleware/security.py`, ROLE_DEFAULT). The service needs
# exactly one of them: `GET /network/info` is where `base_url` comes from when
# the option is empty, the host's first IPv4 address with its prefix length
# stripped (`_host_ipv4` in `src/maverick/ha/options.py`), which is what the
# option's own description promises. Without this the call is refused with 403
# — the api_bypass list covers `/addons/self/...`, which is why writing the
# app's own options needs no permission, but not `/network/...` — and an app
# left on the default `base_url` never gets one, so the setup UI refuses to
# start the link.
hassio_api: true
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "HTTP API and setup UI. Panels that pull frames fetch from this port."
# Ingress opens the setup UI inside Home Assistant itself (embedded, proxied
# by the Supervisor) instead of a raw host:port link, which is the only
# address the "Open Web UI" button could otherwise offer and does not survive
# a remote connection (Nabu Casa, a reverse proxy). The app linter rejects
# `webui` once ingress is enabled, since the button always uses ingress then.
# Panels that pull frames still reach the app directly on the published port
# below; only the button's target changes. The UI emits every URL relative to
# the document (src/maverick/server/ui.py), which is what survives the prefix:
# the Supervisor strips it before proxying and sends no X-Ingress-Path, so a
# root-relative path would resolve against Home Assistant's own origin and
# never reach the app.
ingress: true
ingress_port: 5000
map:
  # /config: maverick.yaml (the displays) plus the frame store and debug output.
  - addon_config:rw
  # /media: where frames for OpenDisplay tags are written so Home Assistant's
  # opendisplay.upload_image action can read them back.
  - media:rw
  # /homeassistant: Home Assistant's own config folder. The ESPHome Device
  # Builder add-on keeps its device configurations there, in `esphome/` —
  # its manifest maps `config:rw` and its start script runs
  # `esphome-device-builder /config/esphome` — not in its own add-on folder,
  # so this is the only mapping that puts a file where the Device Builder
  # lists it. The setup UI's *Send to ESPHome* writes a display's generated
  # configuration to `/homeassistant/esphome/<node>.yaml`
  # (`src/maverick/esphome/install.py`). Read-write because that is a write;
  # nothing here reads anything else in that folder except ESPHome's
  # `secrets.yaml`, to say which of the names the generated file expects are
  # still missing, and nothing writes that file.
  - homeassistant_config:rw
  # /share: for the file transport, so another app or Samba can pick frames up.
  - share:rw
options:
  home_assistant_url: http://homeassistant:8123
  home_assistant_token: ""
  log_level: info
# Optional keys carry no default on purpose: an empty string would not pass
# the url or port types, and an absent key, a JSON null and an empty string are
# all "not set" to the service (`_option` in `src/maverick/ha/options.py`).
schema:
  home_assistant_url: url
  home_assistant_token: password
  # Written by the app itself when you press 'Link with Home Assistant' in
  # its web UI, through the Supervisor's /addons/self/options endpoint. Every
  # app may change its own options without hassio_api, which is why no extra
  # permission is requested here.
  home_assistant_refresh_token: password?
  home_assistant_client_id: str?
  log_level: list(debug|info|warning|error)
  base_url: url?
  api_token: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
