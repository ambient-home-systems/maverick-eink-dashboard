[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maverick-eink-dashboard"
version = "0.1.0"
description = "Render Home Assistant dashboards to e-ink displays: monochrome and colour, scheduled or automation-driven."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maverick contributors" }]
keywords = ["home-assistant", "eink", "e-paper", "dashboard", "opendisplay", "esphome"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
  "License :: OSI Approved :: MIT License",
]

dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "Pillow>=10.2",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "APScheduler>=3.10,<4",
  "paho-mqtt>=2.0",
  "Jinja2>=3.1",
  "playwright>=1.42",
  "websockets>=12.0",
]

[project.optional-dependencies]
opendisplay = ["py-opendisplay>=0.1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
maverick = "maverick.cli:main"

[project.urls]
Homepage = "https://github.com/ambient-home-systems/maverick-eink-dashboard"
Issues = "https://github.com/ambient-home-systems/maverick-eink-dashboard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maverick = ["devices/*.yaml", "config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# B008: FastAPI's Depends() in a default argument is the framework's own idiom.
# UP042: the `str, Enum` members are compared against, and serialised as, plain
# strings in config files, MQTT payloads and the generated reference; StrEnum
# changes what `str(member)` returns, so the suggested rewrite is not a no-op.
ignore = ["B008", "UP042"]
