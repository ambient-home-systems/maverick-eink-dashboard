# Maverick panel catalogue.
#
# Each entry describes a physical e-ink panel well enough that Maverick can
# render, quantise, pack and deliver a frame without the user hand-tuning
# anything. `dpi` is approximate and is used by the render linter to convert
# pixel sizes into physical millimetres, which is what actually governs
# legibility on e-ink.
#
# color_scheme values match maverick.eink.palette.ColorScheme:
#   mono, bwr, bwy, bwry, gray4, gray8, gray16, spectra6, acep7

panels:

  # ---------------------------------------------------------------- generic --
  - id: generic-mono
    name: Generic monochrome e-paper
    vendor: generic
    width: 800
    height: 480
    color_scheme: mono
    dpi: 124
    supports_partial: false
    notes: Safe default when your panel is not listed. Override width/height.

